name: Vigilar cambios

# Avisa (con issues) de todo lo que puede dejar la web desactualizada. Nunca cambia la web por su cuenta:
# cada cambio lo revisa una persona y entra con una PR.
on:
  schedule:
    # Cada lunes: convocatorias nuevas de las ayudas autonómicas y municipales, y fichas por revisar (hora en UTC)
    - cron: '41 6 * * 1'
    # Cada 2 de enero: lista de revisión de las cifras del año nuevo
    - cron: '17 7 2 1 *'
  workflow_dispatch:
    inputs:
      que:
        description: 'Qué vigilar'
        type: choice
        options: [semanal, enero]
        default: semanal

permissions:
  contents: read
  issues: write

jobs:
  semanal:
    if: (github.event_name == 'schedule' && github.event.schedule == '41 6 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.que == 'semanal')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Convocatorias nuevas en la Base de Datos Nacional de Subvenciones
        run: node scripts/convocatorias.mjs

      - name: Fichas sin revisar o con el plazo pasado
        run: node scripts/caducidad.mjs

      - name: Abrir, actualizar o cerrar los avisos
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          avisar() {
            titulo="$1"; archivo="$2"; cerrar="$3"
            abierto=$(gh issue list --repo "$REPO" --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number')
            if [ -s "$archivo" ]; then
              if [ -n "$abierto" ]; then
                gh issue comment "$abierto" --repo "$REPO" --body-file "$archivo"
              else
                gh issue create --repo "$REPO" --title "$titulo" --body-file "$archivo"
              fi
            elif [ -n "$abierto" ] && [ "$cerrar" = "si" ]; then
              gh issue close "$abierto" --repo "$REPO" --comment "Ya no hay nada pendiente."
            fi
          }
          avisar "Convocatorias nuevas de ayudas que recoge la web" convocatorias-novedades.md no
          avisar "Fichas por revisar" revisar.md si

  enero:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 7 2 1 *') || (github.event_name == 'workflow_dispatch' && inputs.que == 'enero')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Preparar la revisión de cifras del año
        run: node scripts/enero.mjs

      - name: Abrir el aviso del año
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh issue create --repo "$REPO" --title "Revisar las cifras de $(date +%Y)" --body-file enero.md
